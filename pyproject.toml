[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quirksim-research"
version = "0.1.0"
description = "Independent macroscopic quirk weak-decay phenomenology prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
quirksim = "quirksim.cli:main"

[tool.setuptools.packages.find]
include = ["quirksim*"]

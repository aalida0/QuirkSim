name: Near-core endpoint error budget (mesh versus integrator)
on:
  push:
    branches: [research/variational-worldsheet]
    paths:
      - '.github/workflows/near-core-error-budget.yml'
      - 'scripts/near_core_error_budget.py'
  workflow_dispatch:

jobs:
  error_budget:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install QuirkSim
        run: python -m pip install -e '.[test]'
      - name: Validate action and mesh guards
        run: python -m pytest -q tests/test_equidistributed_ng.py tests/test_total_arclength_gate.py
      - name: Measure near-core mesh/ODE/regulator error
        run: |
          python -u scripts/near_core_error_budget.py \
            --nodes 5,7,11,15 --cutoff-fraction 0.00002 \
            --output results/near_core_error_budget.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: near-core-error-budget
          path: results/near_core_error_budget.json
          if-no-files-found: ignore
          retention-days: 14

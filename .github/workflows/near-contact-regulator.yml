name: NG short-distance regulator independence
on:
  push:
    branches: [research/variational-worldsheet]
    paths:
      - '.github/workflows/near-contact-regulator.yml'
  workflow_dispatch:

jobs:
  individual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {nodes: 11, step: '0.5', tag: 'n11_h05'}
          - {nodes: 15, step: '0.5', tag: 'n15_h05'}
          - {nodes: 21, step: '0.5', tag: 'n21_h05'}
          - {nodes: 21, step: '0.2', tag: 'n21_h02'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Compare NG geometry with ten-times smaller regulator
        run: |
          python -u scripts/run_near_contact_shape.py \
            --nodes ${{ matrix.nodes }} \
            --max-step-ps ${{ matrix.step }} \
            --regulator-cm 1e-10 --pinch-fraction 0.00002 \
            --output results/near_contact_${{ matrix.tag }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regulator-1e-10-${{ matrix.tag }}
          path: results/near_contact_${{ matrix.tag }}.json
          retention-days: 14
          if-no-files-found: ignore

  audit:
    needs: individual
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: regulator-1e-10-*
          path: results
          merge-multiple: true
      - name: Inspect regulator-sensitive string geometry
        run: |
          python -u scripts/audit_near_contact_shape.py \
            --input-dir results --output results/near_contact_audit_reg1e-10.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regulator-1e-10-geometry-audit
          path: results/near_contact_audit_reg1e-10.json
          retention-days: 14
          if-no-files-found: ignore

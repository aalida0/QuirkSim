name: NG near-infracolor length-scale diagnostic
on:
  push:
    branches: [research/variational-worldsheet]
    paths:
      - '.github/workflows/near-infracolor-length.yml'
  workflow_dispatch:

jobs:
  individual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {nodes: 11, step: '0.5', tag: 'n11_h05'}
          - {nodes: 11, step: '0.2', tag: 'n11_h02'}
          - {nodes: 15, step: '0.5', tag: 'n15_h05'}
          - {nodes: 21, step: '0.5', tag: 'n21_h05'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Resolve 0.0000001 cm total length with explicit gauge and mesh gates
        run: |
          python -u scripts/run_near_contact_shape.py \
            --nodes ${{ matrix.nodes }} --max-step-ps ${{ matrix.step }} \
            --regulator-cm 1e-12 --pinch-fraction 0.000001 \
            --output results/near_contact_${{ matrix.tag }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: near-infracolor-${{ matrix.tag }}
          path: results/near_contact_${{ matrix.tag }}.json
          if-no-files-found: ignore
          retention-days: 14

  audit:
    needs: individual
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: near-infracolor-*
          path: results
          merge-multiple: true
      - name: Report near-core scale convergence without annihilation claim
        run: |
          python -u scripts/audit_near_contact_shape.py \
            --input-dir results --output results/near_infracolor_geometry_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: near-infracolor-geometry-audit
          path: results/near_infracolor_geometry_audit.json
          if-no-files-found: ignore
          retention-days: 14

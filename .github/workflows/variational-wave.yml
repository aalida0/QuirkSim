name: Variational transverse-mode wave speed refinement
on:
  push:
    branches: [research/variational-worldsheet]
    paths:
      - '.github/workflows/variational-wave.yml'
      - 'scripts/validate_transverse_wave.py'
  workflow_dispatch:

jobs:
  lowest-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Compare transverse wave half-period to linear NG
        run: python -u scripts/validate_transverse_wave.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: variational-transverse-wave-validation
          path: results/variational_transverse_wave.json
          if-no-files-found: ignore
          retention-days: 14

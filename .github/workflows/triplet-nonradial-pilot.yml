name: Triplet nonradial sensitivity pilot
on:
  push:
    branches: [development/standalone-simulator]
    paths:
      - '.github/workflows/triplet-nonradial-pilot.yml'
      - 'scripts/triplet_impact_scan.py'
  workflow_dispatch:

jobs:
  physics-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent simulator
        run: python -m pip install -e '.[test]'
      - name: Validate physics and scan pipeline
        run: python -m pytest -q
      - name: Nonradial matched triplet pilot, 20 seeds per impact offset
        run: |
          python -u scripts/triplet_impact_scan.py \
            --mass 225 --lambda-ev 774 --duration-ps 1000 \
            --impact-um 0,0.01,0.1,1,3,10 \
            --seed 10 --nevents 20 --progress-every 20 \
            --output-dir results/triplet_impact_20
      - name: Store numerical pilot reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triplet-nonradial-pilot
          path: results/triplet_impact_20/
          if-no-files-found: ignore
          retention-days: 14

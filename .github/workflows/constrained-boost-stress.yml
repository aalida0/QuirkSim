name: 2T massive-endpoint NG boost-dependence and long-time mesh
on:
  push:
    branches: [research/variational-worldsheet]
    paths:
      - '.github/workflows/constrained-boost-stress.yml'
  workflow_dispatch:

jobs:
  boost:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        nodes: ['5','7']
        boost: ['0.45','0.65','0.80']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install physics prototype
        run: python -m pip install -e .
      - name: Test pre-stretched NG string at 2T with different CM boosts
        run: |
          python -u scripts/equidistributed_gauge_stress.py \
            --nodes ${{ matrix.nodes }} --max-time-ps 1000 --field-only \
            --selected-b-tesla 2 --pair-boost ${{ matrix.boost }} \
            --pinch-fraction 1e-5 \
            --output results/boost_${{ matrix.boost }}_n${{ matrix.nodes }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ng-2T-boost-${{ matrix.boost }}-n${{ matrix.nodes }}
          path: results/boost_${{ matrix.boost }}_n${{ matrix.nodes }}.json
          if-no-files-found: ignore
          retention-days: 14

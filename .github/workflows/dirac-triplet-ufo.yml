name: Dirac triplet UFO structural checks
on:
  push:
    branches: [feature/dirac-triplet-ew-lo]
  workflow_dispatch:
jobs:
  structural-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python UFO import and physics-structure checks
        run: python scripts/validate_dirac_triplet_ufo.py models/DiracTripletEW_UFO
      - name: Triplet LHE analyzer synthetic tests
        run: python -m unittest discover -s tests -p 'test_triplet_lhe_analysis.py' -v
      - name: Install QuirkSim simulation dependencies
        run: python -m pip install -e '.[test]'
      - name: Independent SU(2) vectorlike triplet generator audit
        run: python scripts/audit_dirac_triplet_representation.py
      - name: Check charged-neutral Pythia8-to-QuirkSim propagation
        run: python -m pytest -q tests/test_production_dynamics.py
      - name: Check triplet production topology summary
        run: python -m unittest discover -s tests -p 'test_triplet_propagation_summary.py' -v
      - name: Test ATLAS barrel-cylinder crossing summary
        run: python -m pytest -q tests/test_triplet_barrel_summary.py
      - name: Check paired recoil pixel-barrel crossing migrations
        run: python -m unittest discover -s tests -p 'test_triplet_recoil_barrel_comparison.py' -v
      - name: Test paired recoil encounter distributions and censoring
        run: python -m unittest discover -s tests -p 'test_triplet_recoil_encounters.py' -v
      - name: Check reproducible six-channel NLO production cards
        run: python -m unittest discover -s tests -p 'test_triplet_nlo_inclusive_cards.py' -v
      - name: Test NNPDF NLO uncertainty extraction without Python LHAPDF
        run: python -m unittest discover -s tests -p 'test_triplet_nlo_pdf_replicas.py' -v
      - name: Test seven-point NLO scale reweight extraction
        run: python -m unittest discover -s tests -p 'test_triplet_nlo_7point.py' -v

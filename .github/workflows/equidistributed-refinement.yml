name: Constrained string pre-pinch mesh convergence
on:
  push:
    branches: [research/variational-worldsheet]
    paths:
      - '.github/workflows/equidistributed-refinement.yml'
      - 'scripts/equidistributed_prepinch_convergence.py'
  workflow_dispatch:

jobs:
  n5n7n11:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Fixed 200ps endpoint mesh convergence with uniform 2T B
        run: python -u scripts/equidistributed_prepinch_convergence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: constrained-ng-prepinch-mesh-refinement
          path: results/equidistributed_prepinch_convergence.json
          if-no-files-found: ignore
          retention-days: 14

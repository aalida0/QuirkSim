name: Long-time worldsheet mesh health
on:
  push:
    branches: [research/variational-worldsheet]
    paths:
      - '.github/workflows/variational-longtime.yml'
      - 'scripts/longtime_worldsheet_stress.py'
  workflow_dispatch:

jobs:
  full-return:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install standalone simulator
        run: python -m pip install -e .
      - name: First-return and string mesh health stress
        run: python -u scripts/longtime_worldsheet_stress.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triplet-worldsheet-first-return-mesh-health
          path: results/worldsheet_longtime_stress.json
          if-no-files-found: ignore
          retention-days: 14

name: Triplet Pythia8 shower smoke
on:
  workflow_dispatch:
  push:
    branches: [feature/dirac-triplet-ew-lo]
    paths:
      - 'scripts/triplet_pythia8_isr.cc'
      - 'scripts/run_triplet_pythia8.py'
      - '.github/workflows/triplet-pythia8-isr.yml'
jobs:
  pythia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: quirk-pythia
          create-args: >-
            -c conda-forge
            python=3.11
            pythia8
      - name: Construct valid 2-to-2 Drell-Yan LHE fixture
        shell: micromamba-shell {0}
        run: |
          python - <<'PY'
          from pathlib import Path
          import math
          Path('results').mkdir(exist_ok=True)
          mass=225.15717
          e=500.0
          px=100.0
          pz=math.sqrt(e*e-px*px-mass*mass)
          h=['<LesHouchesEvents version="1.0">',
             '<init>',
             '2212 2212 6800.0 6800.0 0 0 0 0 3 1',
             '1.0 0.0 1.0 1',
             '</init>']
          for j in range(3):
              h += ['<event>', '4 1 1.0 500.0 0.007 0.118',
                    '2 -1 0 0 501 0 0 0 500 500 0 0 9',
                    '-2 -1 0 0 0 501 0 0 -500 500 0 0 9',
                    f'9000111 1 1 2 0 0 {px} 0 {pz} {e} {mass} 0 9',
                    f'-9000111 1 1 2 0 0 {-px} 0 {-pz} {e} {mass} 0 9',
                    '</event>']
          h+=['</LesHouchesEvents>']
          Path('results/synthetic_triplet.lhe').write_text('\n'.join(h)+'\n')
          PY
      - name: Compile and shower exotic LHE
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          export PYTHIA8_DIR="$CONDA_PREFIX"
          python scripts/run_triplet_pythia8.py results/synthetic_triplet.lhe --out results/test_isr.jsonl --nevents 3
          test $(wc -l < results/test_isr.jsonl) -eq 3
          python - <<'PY'
          import json
          lines=[json.loads(x) for x in open('results/test_isr.jsonl')]
          assert len(lines)==3
          for r in lines:
              assert len(r['endpoints'])==2
              assert {x['pdg_id'] for x in r['endpoints']}=={9000111,-9000111}
              assert r['pair_pt_gev']>=0
          print('PASS Pythia8 exotic pair shower JSONL:',len(lines),'events')
          PY
      - name: Save Pythia8 smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quirk-pythia8-isr-smoke
          path: results/test_isr.jsonl
          if-no-files-found: ignore

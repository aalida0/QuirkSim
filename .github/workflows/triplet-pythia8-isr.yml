name: Triplet Pythia8 shower smoke
on:
  workflow_dispatch:
  push:
    branches: [feature/dirac-triplet-ew-lo]
    paths:
      - 'scripts/triplet_pythia8_isr.cc'
      - 'scripts/run_triplet_pythia8.py'
      - '.github/workflows/triplet-pythia8-isr.yml'
jobs:
  pythia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: quirk-pythia
          create-args: >-
            -c conda-forge
            python=3.11
            pythia8
            numpy
            scipy
            pip
      - name: Construct valid 2-to-2 Drell-Yan LHE fixture
        shell: micromamba-shell {0}
        run: |
          python - <<'PY'
          from pathlib import Path
          import math
          Path('results').mkdir(exist_ok=True)
          mass_c=225.15717
          mass_n=225.0
          sqrt_s=1000.0
          px=100.0
          h=['<LesHouchesEvents version="1.0">',
             '<init>',
             '2212 2212 6800.0 6800.0 0 0 0 0 3 1',
             '1.0 0.0 1.0 1',
             '</init>']
          pairs=[
              (9000111,-9000111,2,-2),
              (9000113,-9000113,2,-2),
              (9000111,-9000112,2,-1),
              (9000112,-9000113,2,-1),
              (-9000111,9000112,1,-2),
              (-9000112,9000113,1,-2),
          ]
          for id_a,id_b,beam_a,beam_b in pairs:
              ma=mass_n if abs(id_a)==9000112 else mass_c
              mb=mass_n if abs(id_b)==9000112 else mass_c
              ea=(sqrt_s**2+ma**2-mb**2)/(2*sqrt_s)
              eb=sqrt_s-ea
              pz=math.sqrt(ea**2-ma**2-px**2)
              h += ['<event>', '4 1 1.0 500.0 0.007 0.118',
                    f'{beam_a} -1 0 0 501 0 0 0 500 500 0 0 9',
                    f'{beam_b} -1 0 0 0 501 0 0 -500 500 0 0 9',
                    f'{id_a} 1 1 2 0 0 {px} 0 {pz} {ea} {ma} 0 9',
                    f'{id_b} 1 1 2 0 0 {-px} 0 {-pz} {eb} {mb} 0 9',
                    '</event>']
          h+=['</LesHouchesEvents>']
          Path('results/synthetic_triplet.lhe').write_text('\n'.join(h)+'\n')
          PY
      - name: Compile and shower exotic LHE
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          export PYTHIA8_DIR="$CONDA_PREFIX"
          python scripts/run_triplet_pythia8.py results/synthetic_triplet.lhe --out results/test_isr.jsonl --nevents 6
          test $(wc -l < results/test_isr.jsonl) -eq 6
          python - <<'PY'
          import json
          lines=[json.loads(x) for x in open('results/test_isr.jsonl')]
          assert len(lines)==6
          for r in lines:
              assert len(r['endpoints'])==2
              assert {x['pdg_id']>0 for x in r['endpoints']}=={True,False}
              assert r['pair_pt_gev']>=0
          assert sum(sum(x['charge_e']!=0 for x in r['endpoints'])==1 for r in lines)==4
          print('PASS Pythia8 exotic pair shower (2 charged + 4 charged-neutral):',len(lines))
          PY
      - name: Propagate showered charged-neutral event into QuirkSim
        shell: micromamba-shell {0}
        run: |
          python -m pip install -e .
          python scripts/propagate_triplet_isr.py results/test_isr.jsonl \
            --nevents 6 --mode stable --duration-ps 0.1 \
            --output results/propagated_triplet.jsonl
          python - <<'PY'
          import json
          rows=[json.loads(x) for x in open('results/propagated_triplet.jsonl')]
          assert len(rows)==6
          assert sum(r['initial_charged_endpoints']==1 for r in rows)==4
          assert sum(r['initial_charged_endpoints']==2 for r in rows)==2
          assert all(r['n_weak_decays']==0 for r in rows)
          print('PASS full Pythia8 -> QuirkSim six-channel bridge')
          PY

      - name: Save Pythia8 smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quirk-pythia8-isr-smoke
          path: |
            results/test_isr.jsonl
            results/propagated_triplet.jsonl
          if-no-files-found: ignore

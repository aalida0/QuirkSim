name: Variational worldsheet research validation
on:
  push:
    branches: [research/variational-worldsheet]
  workflow_dispatch:

jobs:
  physics-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install independent QuirkSim
        run: python -m pip install -e '.[test]'
      - name: Regress full research test suite
        run: python -m pytest -q

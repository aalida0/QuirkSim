name: Bounded-velocity first-return stress
on:
  push:
    branches: [research/variational-worldsheet]
    paths:
      - '.github/workflows/variational-rapidity-longtime.yml'
      - 'scripts/longtime_rapidity_stress.py'
  workflow_dispatch:

jobs:
  first-return:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        b_tesla: ['0','2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Rapidity coordinate unit regression
        run: python -m pytest -q tests/test_variational_rapidity.py
      - name: Long-time spatial string and mesh gate
        run: |
          python -u scripts/longtime_rapidity_stress.py \
            --nodes 5 --duration-ps 260 --b-tesla ${{ matrix.b_tesla }} \
            --output results/rapidity_${{ matrix.b_tesla }}T.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapidity-260ps-${{ matrix.b_tesla }}T
          path: results/rapidity_${{ matrix.b_tesla }}T.json
          if-no-files-found: ignore
          retention-days: 14
